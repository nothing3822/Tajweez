<!DOCTYPE html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>میرا حساب</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f4;--c:#fff;--t:#14211f;--m:#66797a;--p:#0f766e;--g:#15803d;--r:#dc2626;--b:#dfe7e4}
body.d{--bg:#0d1514;--c:#16201f;--t:#e8f1ef;--m:#93a8a3;--b:#26332f;--g:#4ade80;--r:#f87171}
*{box-sizing:border-box;margin:0}
body{font-family:'Noto Naskh Arabic','Jameel Noori Nastaleeq',serif;background:var(--bg);color:var(--t);padding-bottom:90px;line-height:1.7}
header{background:var(--p);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between;align-items:center;font-size:1.25rem;font-weight:700}
main{padding:10px 12px;max-width:640px;margin:auto}
h3{font-size:1rem;margin:4px 0}
.c{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px 12px;margin:8px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px}.g2 span{display:flex;flex-direction:column;font-size:.85rem;color:var(--m)}.g2 b{color:var(--t)}
.c small{color:var(--m);display:block}.c b{font-size:1.1rem}
.in{color:var(--g)}.ex{color:var(--r)}.am{color:#d97706}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.br{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;font-size:.85rem;margin:6px 0}.br div{background:var(--b);border-radius:9px;height:10px;overflow:hidden}.br i{display:block;height:100%;background:var(--p)}
.bt{display:block;width:100%;background:var(--p);color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;margin:8px 0;font-weight:700}
.bt2{background:var(--b);color:var(--t);border:0;border-radius:10px;padding:8px 12px;font:inherit}
.tp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tp button{flex:1;border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:10px;padding:8px 4px;font:inherit;font-size:.9rem}.tp .on{background:var(--p);color:#fff;border-color:var(--p)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:10}nav button{flex:1;border:0;background:0;color:var(--m);font:inherit;padding:6px 0;font-size:.78rem}nav .on{color:var(--p);font-weight:700}
.fab{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom));left:16px;width:58px;height:58px;border-radius:50%;background:#d97706;color:#fff;border:0;font-size:2rem;box-shadow:0 4px 14px #0005;z-index:11}
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;flex-direction:column;gap:12px;display:none}
#md{display:none;position:fixed;inset:0;background:#0007;z-index:40;align-items:flex-end}.sh{background:var(--c);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
label{display:block;margin:8px 0;font-size:.9rem}input,select{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;font:inherit;background:var(--bg);color:var(--t)}
a{color:var(--p);cursor:pointer}.mt{color:var(--m);text-align:center;padding:20px}
#sp{position:fixed;inset:0;z-index:99;background:linear-gradient(165deg,#0f766e,#052e2b);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#sp img{width:170px;height:170px;border-radius:50%;object-fit:cover;border:4px solid #fff9;box-shadow:0 10px 40px #0007}
#sp h1{font-size:2.4rem}#sp p{opacity:.85}
.bar{width:55%;height:6px;background:#fff3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#fff;width:0;animation:f 5s linear forwards}
@keyframes f{to{width:100%}}
#sp small{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));letter-spacing:2px;opacity:.9;direction:ltr;font-size:.95rem}
@media print{nav,.fab,header button,.np{display:none}}
</style></head><body>

s(){return D.src.map(o=>{const L=D.tx.filter(x=>x.s==o.id),i=N(L,'in'),x=N(L,'ex');return `<div class="c" style="border-right:6px solid ${o.c}"><div class="row"><h3>${e(o.n)}</h3><a onclick="delS(${o.id})">حذف</a></div><div class="g2"><span>کل آمدنی<b class="in">${fmt(i)}</b></span><span>خرچ<b class="ex">${fmt(x)}</b></span><span>منافع<b>${fmt(i-x)}</b></span><span>لگایا ہوا سرمایہ<b>${fmt(N(L,'inv'))}</b></span><span>گھر لے گئے<b>${fmt(N(L,'wd'))}</b></span></div></div>`}).join('')+'<button class="bt" onclick="addS()">+ نیا ذریعہ آمدنی</button>'},
l(){const f=k=>D.ln.filter(x=>x.k==k).reduce((s,x)=>s+x.a-x.p,0);
return `<div class="g">${kc('مجھے لینا ہے',f('l'),'in')}${kc('مجھے دینا ہے',f('d'),'ex')}</div>`+D.ln.map(x=>`<div class="c row"><div><b>${e(x.w)}</b> · ${x.k=='l'?'لینا':'دینا'}<small>کل ${fmt(x.a)} · ادا ${fmt(x.p)} · باقی ${fmt(x.a-x.p)}</small></div><div><a onclick="pay(${x.id})">رقم</a> &nbsp; <a onclick="delL(${x.id})">✕</a></div></div>`).join('')+'<button class="bt" onclick="addL()">+ نیا ادھار</button>'},
r(){const T=D.tx.filter(rng(P)),cs={},ss={};T.forEach(x=>{if(x.t=='ex')cs[x.c]=(cs[x.c]||0)+x.a;if(x.t=='in')ss[sn(x.s)]=(ss[sn(x.s)]||0)+x.a});
return `<div class="tp">${[['d','آج'],['w','ہفتہ'],['m','مہینہ'],['y','سال']].map(([k,n])=>`<button class="${P==k?'on':''}" onclick="P='${k}';R()">${n}</button>`).join('')}</div><div class="g">${kc('آمدنی',N(T,'in'),'in')}${kc('خرچ',N(T,'ex'),'ex')}</div><div class="c">بچت: <b>Rs ${fmt(N(T,'in')-N(T,'ex'))}</b></div><div class="c"><h3>آمدنی (ذرائع کے مطابق)</h3>${bars(ss)}</div><div class="c"><h3>خرچ (اقسام کے مطابق)</h3>${bars(cs)}</div><div class="tp np"><button onclick="csv()">Excel / CSV</button><button onclick="print()">پرنٹ / PDF</button><button onclick="wa()">واٹس ایپ</button></div>`},
t(){return `<div class="c"><h3>فونٹ سائز</h3><input type="range" min="14" max="24" value="${D.s.fs}" oninput="D.s.fs=+this.value;save();ap()"></div>
<div class="c row">ڈارک موڈ<button class="bt2" onclick="D.s.dk^=1;save();ap()">بدلیں</button></div>
<div class="c"><h3>خرچ کی اقسام اور ماہانہ بجٹ</h3>${D.cat.map((c,i)=>`<div class="row"><span>${e(c)}</span><a onclick="bud(${i})">بجٹ: ${fmt(D.bg[c]||0)}</a></div>`).join('')}<button class="bt2" style="margin-top:8px" onclick="addC()">+ نئی قسم</button></div>
<div class="c row">پن لاک ${D.s.pin?'(فعال)':''}<button class="bt2" onclick="pin()">${D.s.pin?'ہٹائیں':'لگائیں'}</button></div>
<div class="c"><h3>بیک اپ</h3><div class="tp"><button onclick="bk()">بیک اپ بنائیں</button><button onclick="$('#rf').click()">بیک اپ واپس لائیں</button></div><input id="rf" type="file" accept=".json" hidden onchange="rs(this)"></div>
<div class="c row">ایپ انسٹال کریں<button class="bt2" onclick="inst()">📲 انسٹال</button></div>
<button class="bt" style="background:var(--r)" onclick="if(confirm('سارا ڈیٹا مٹ جائے گا۔ کیا یقین ہے؟')){LS.removeItem('hk');location.reload()}">سارا ڈیٹا مٹائیں</button><p class="mt">by XiTorque Studio</p>`}};
const NV=[['h','🏠','ہوم'],['s','🏪','ذرائع'],['l','🤝','ادھار'],['r','📊','رپورٹ'],['t','⚙️','ترتیبات']];
function R(){$('#v').innerHTML=V[tab]();$('#nv').innerHTML=NV.map(([k,i,n])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';R();scrollTo(0,0)">${i}<br>${n}</button>`).join('')}
function ap(){document.documentElement.style.fontSize=D.s.fs+'px';document.body.classList.toggle('d',!!D.s.dk)}
function add(){ET='in';$('#md').innerHTML=`<div class="sh"><h3>نئی انٹری</h3><div class="tp" id="tb"></div><label>ذریعہ<select id="sr"></select></label><label id="cl">قسم<select id="ct">${D.cat.map(c=>`<option>${e(c)}</option>`).join('')}</select></label><label>رقم (Rs)<input id="am" type="number" inputmode="numeric"></label><label>تاریخ<input id="dt" type="date" value="${today()}"></label><label>نوٹ<span class="row"><input id="nt"><button class="bt2" onclick="mic()">🎤</button></span></label><button class="bt" onclick="sv()">محفوظ کریں</button><button class="bt2" style="width:100%" onclick="cm()">بند کریں</button></div>`;$('#md').style.display='flex';st()}
function st(){$('#tb').innerHTML=Object.entries(TL).map(([k,n])=>`<button class="${ET==k?'on':''}" onclick="ET='${k}';st()">${n}</button>`).join('');$('#sr').innerHTML=(ET=='ex'?'<option value="0">گھر (عام)</option>':'')+D.src.map(o=>`<option value="${o.id}">${e(o.n)}</option>`).join('');$('#cl').style.display=ET=='ex'?'':'none'}
const cm=()=>$('#md').style.display='none';
function sv(){const a=+$('#am').value;if(!(a>0))return alert('رقم لکھیں');D.tx.unshift({id:Date.now(),t:ET,s:+$('#sr').value,c:ET=='ex'?$('#ct').value:'',a,d:$('#dt').value||today(),n:$('#nt').value});save();cm();R()}
function del(id){if(confirm('یہ انٹری حذف کریں؟')){D.tx=D.tx.filter(x=>x.id!=id);save();R()}}
function mic(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return alert('اس براؤزر میں آواز سے لکھنا دستیاب نہیں (کروم استعمال کریں)');const r=new S();r.lang='ur-PK';r.onresult=ev=>{const s=ev.results[0][0].transcript;$('#nt').value=s;const m=s.replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).match(/\d+/);if(m&&!$('#am').value)$('#am').value=m[0]};r.onerror=()=>alert('آواز نہیں سمجھ سکا، انٹرنیٹ چیک کریں');r.start()}
function addS(){const n=prompt('ذریعہ آمدنی کا نام؟ (مثلاً کرایہ، تنخواہ)');if(!n)return;D.src.push({id:Date.now(),n,c:['#2563eb','#9333ea','#db2777','#0891b2','#65a30d'][D.src.length%5]});save();R()}
function delS(id){if(confirm('یہ ذریعہ حذف کریں؟ اس کی انٹریاں رہیں گی۔')){D.src=D.src.filter(o=>o.id!=id);save();R()}}
function addL(){const w=prompt('کس کا نام؟');if(!w)return;const a=+prompt('کل رقم؟');if(!(a>0))return;D.ln.unshift({id:Date.now(),w,a,p:0,k:confirm('کیا یہ رقم آپ نے لینی ہے؟\nOK = مجھے لینا ہے\nCancel = مجھے دینا ہے')?'l':'d'});save();R()}
function pay(id){const x=D.ln.find(o=>o.id==id),a=+prompt('کتنی رقم ادا/وصول ہوئی؟ (باقی '+fmt(x.a-x.p)+')');if(a>0){x.p=Math.min(x.a,x.p+a);save();R()}}
function delL(id){if(confirm('حذف کریں؟')){D.ln=D.ln.filter(o=>o.id!=id);save();R()}}
function bud(i){const c=D.cat[i],a=prompt('ماہانہ بجٹ برائے '+c+' (0 = بند)',D.bg[c]||0);if(a!==null){D.bg[c]=+a||0;save();R()}}
function addC(){const n=prompt('نئی قسم کا نام؟');if(n){D.cat.push(n);save();R()}}
function pin(){if(D.s.pin){D.s.pin=''}else{const p=prompt('نیا پن (4 سے 6 ہندسے)');if(!/^\d{4,6}$/.test(p||''))return alert('صرف 4 سے 6 ہندسے لکھیں');D.s.pin=p}save();R()}
function unl(){if($('#pn').value==D.s.pin){$('#lk').style.display='none';$('#pn').value=''}}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function bk(){dl('mera-hisab-backup-'+today()+'.json',JSON.stringify(D),'application/json')}
function rs(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.tx)throw 0;D=o;save();ap();R();alert('ڈیٹا واپس آ گیا')}catch(x){alert('غلط فائل')}};r.readAsText(f)}
function csv(){const T=D.tx.filter(rng(P));dl('hisab.csv','\ufeffتاریخ,قسم,ذریعہ,کیٹیگری,رقم,نوٹ\n'+T.map(x=>[x.d,TL[x.t],sn(x.s),x.c,x.a,'"'+(x.n||'').replace(/"/g,'""')+'"'].join(',')).join('\n'),'text/csv')}
function wa(){const T=D.tx.filter(rng(P)),n={d:'آج',w:'اس ہفتے',m:'اس مہینے',y:'اس سال'}[P];open('https://wa.me/?text='+encodeURIComponent(`📒 میرا حساب (${n})\nآمدنی: Rs ${fmt(N(T,'in'))}\nخرچ: Rs ${fmt(N(T,'ex'))}\nبچت: Rs ${fmt(N(T,'in')-N(T,'ex'))}`))}
addEventListener('beforeinstallprompt',ev=>{ev.preventDefault();IP=ev});
addEventListener('appinstalled',()=>$('#ib').style.display='none');
function inst(){IP?IP.prompt():alert('براؤزر کے مینو (⋮) میں "Add to Home screen" / "ہوم اسکرین پر شامل کریں" چنیں۔ آئی فون میں شیئر بٹن سے۔')}
if(matchMedia('(display-mode:standalone)').matches)$('#ib').style.display='none';
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
ap();R();if(D.s.pin)$('#lk').style.display='flex';
setTimeout(()=>{$('#sp').style.opacity=0;setTimeout(()=>$('#sp').remove(),600)},5000);
</script></body></html>
